name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          POSTGRES_DB: agentforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentforge -d agentforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://agentforge:agentforge@localhost:5432/agentforge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pull sandbox image
        run: docker pull python:3.12-alpine

      - name: Test
        run: make test

      - name: Kill drills
        run: make drill

  image:
    # The same image runs api, worker, mock_effects, and migrations (and ships to ECR in Phase 4).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t agentforge:ci .

      - name: Smoke test image
        run: |
          docker run --rm agentforge:ci python -c "import app.main, app.worker, mock_effects.app"
          docker run --rm agentforge:ci docker --version
