name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --group dev
      - name: Lint and run isolated tests plus recovery drills
        run: make verify
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-checks
          path: reports/checks/
          retention-days: 14

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen --group dev
      - name: Build and start isolated TestForge target
        run: make testforge-up
      - name: Exercise API, worker, sandbox and report service
        run: make testforge-smoke
      - name: Save diagnostics and remove test volumes
        if: always()
        run: make testforge-down
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-testforge-readiness
          path: reports/testforge/
          retention-days: 14

  terraform:
    # Validation only. No AWS account, credentials, apply, or cloud resources.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TF_VAR_region: us-east-2
      TF_VAR_allowed_cidr: 203.0.113.0/32
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Format, validate and test with a mocked provider
        run: make tf-check
